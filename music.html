
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>MUSIC | KLKSTUDIO</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Space+Mono:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #090909;
      color: #f2f0eb;
      font-family: 'Space Mono', monospace;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: .16;
      background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 7%;
      border-bottom: 1px solid #292929;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    nav {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: #999;
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 1px;
      transition: .2s;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    main {
      position: relative;
      z-index: 2;
      max-width: 1050px;
      margin: auto;
      padding: 65px 7% 100px;
    }

    .eyebrow {
      color: #888;
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(75px, 17vw, 150px);
      font-weight: 900;
      line-height: .8;
      letter-spacing: -5px;
      text-transform: uppercase;
      margin-bottom: 65px;
      text-shadow: 3px 3px 0 #393939;
    }

    .release {
      border-top: 1px solid #383838;
      padding: 30px 0 38px;
    }

    .release-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 15px;
      margin-bottom: 18px;
    }

    .release-type {
      color: #888;
      font-size: 9px;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(35px, 8vw, 55px);
      line-height: .95;
      font-weight: 900;
      text-transform: uppercase;
    }

    .artist {
      color: #aaa;
      font-size: 11px;
      margin-top: 9px;
    }

    .year {
      color: #777;
      font-size: 11px;
      white-space: nowrap;
    }

    .spotify-player {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #181818;
    }

    .single-player {
      height: 152px;
    }

    .album-player {
      height: 380px;
    }

    .bottom-line {
      margin-top: 55px;
      padding-top: 20px;
      border-top: 1px solid #292929;
      color: #666;
      font-size: 9px;
      letter-spacing: 2px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 6%;
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 9px;
      }

      main {
        padding: 55px 6% 75px;
      }

      h1 {
        margin-bottom: 50px;
        letter-spacing: -3px;
      }

      .release {
        padding: 25px 0 30px;
      }

      .album-player {
        height: 380px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">KLKSTUDIO.</a>

    <nav>
      <a href="index.html">HOME</a>
      <a href="music.html" class="active">MUSIC</a>
      <a href="productions.html">PRODUCTIONS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">KLKSTUDIO / RELEASES</p>
    <h1>MUSIC.</h1>

    <!-- RELEASE 01 -->
    <section class="release">
      <div class="release-top">
        <div>
          <p class="release-type">SINGLE / 01</p>
          <h2>vAmonos Remix</h2>
          <p class="artist">AlejoKlk</p>
        </div>
      </div>

      <iframe
        class="spotify-player single-player"
        src="https://open.spotify.com/embed/track/5quAccqHhwMAhgsnFK2e0V?utm_source=generator"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </section>

    <!-- RELEASE 02 -->
    <section class="release">
      <div class="release-top">
        <div>
          <p class="release-type">EP / 02</p>
          <h2>ANOMO</h2>
          <p class="artist">AlejoKlk</p>
        </div>
        <span class="year">2026</span>
      </div>

      <iframe
        class="spotify-player album-player"
        src="https://open.spotify.com/embed/album/4onqmiokrin25Repgs0vKw?utm_source=generator"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </section>

    <!-- RELEASE 03 -->
    <section class="release">
      <div class="release-top">
        <div>
          <p class="release-type">SINGLE / 03</p>
          <h2>Me Niegas</h2>
          <p class="artist">AlejoKlk x REG</p>
        </div>
      </div>

      <iframe
        class="spotify-player single-player"
        src="https://open.spotify.com/embed/track/7pIGthRglhbO0TJHaxL8bQ?utm_source=generator"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </section>

    <div class="bottom-line">
      <span>KLKSTUDIO © 2026</span>
      <span>INDEPENDENT MUSIC PRODUCTION</span>
    </div>
  </main>

</body>
</html>
