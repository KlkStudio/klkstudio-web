<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLKSTUDIO | Independent Music Production</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090909;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  opacity: .12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}

header {
  height: 90px;
  padding: 0 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #292929;
}

.logo {
  font-size: 24px;
  font-weight: 1000;
  letter-spacing: -1px;
  color: white;
  text-decoration: none;
}

.logo span {
  color: #777;
}

nav {
  display: flex;
  gap: 28px;
}

nav a {
  color: #888;
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 2px;
  transition: .3s;
}

nav a:hover {
  color: white;
}

.hero {
  min-height: 78vh;
  padding: 100px 9%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.hero::after {
  content: "KLK";
  position: absolute;
  right: -30px;
  bottom: -100px;
  font-size: 42vw;
  font-weight: 1000;
  color: #111;
  z-index: 0;
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 1;
}

.tag {
  color: #888;
  font-size: 10px;
  letter-spacing: 6px;
  margin-bottom: 35px;
}

h1 {
  font-size: clamp(65px, 13vw, 165px);
  font-weight: 1000;
  letter-spacing: -10px;
  line-height: .78;
}

h1 span {
  display: block;
  color: #777;
  margin-top: 12px;
}

.subtitle {
  margin-top: 45px;
  color: #999;
  font-size: 12px;
  letter-spacing: 3px;
}

.cta {
  display: inline-block;
  margin-top: 40px;
  padding: 17px 28px;
  background: white;
  color: black;
  text-decoration: none;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  transition: .3s;
}

.cta:hover {
  background: #888;
}

.bottom {
  padding: 25px 9%;
  display: flex;
  justify-content: space-between;
  border-top: 1px solid #292929;
  color: #666;
  font-size: 10px;
  letter-spacing: 2px;
}

@media(max-width: 650px) {
  header {
    height: auto;
    padding: 25px 6%;
    flex-direction: column;
    gap: 25px;
  }

  nav {
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  nav a {
    font-size: 9px;
  }

  .hero {
    min-height: 75vh;
    padding: 75px 7%;
  }

  h1 {
    letter-spacing: -5px;
  }

  .bottom {
    gap: 15px;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">KLK<span>STUDIO.</span></a>

  <nav>
    <a href="index.html">HOME</a>
    <a href="music.html">MUSIC</a>
    <a href="productions.html">PRODUCTIONS</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<main class="hero">
  <div class="content">
    <p class="tag">INDEPENDENT MUSIC PRODUCTION</p>

    <h1>
      KLK
      <span>STUDIO.</span>
    </h1>

    <p class="subtitle">
      SOUND IS IDENTITY. CREATE YOUR OWN.
    </p>

    <a href="music.html" class="cta">
      EXPLORE OUR SOUND ↗
    </a>
  </div>
</main>

<footer class="bottom">
  <span>© 2026 KLKSTUDIO</span>
  <span>INDEPENDENT CREATIVE SPACE</span>
  <span>BUENOS AIRES · ARGENTINA</span>
</footer>

</body>
</html>
