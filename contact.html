<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT | KLKSTUDIO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 28px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292929;
    }

    .logo {
      color: white;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: #999;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
    }

    nav a:hover,
    nav a.active {
      color: white;
    }

    main {
      min-height: 78vh;
      padding: 85px 10%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tag {
      color: #888;
      font-size: 11px;
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(55px, 11vw, 110px);
      letter-spacing: -5px;
      margin-bottom: 25px;
    }

    .intro {
      color: #888;
      max-width: 500px;
      line-height: 1.8;
      margin-bottom: 55px;
    }

    .contact-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      padding: 25px 0;
      border-top: 1px solid #333;
      color: white;
      text-decoration: none;
      font-size: 19px;
      letter-spacing: 1px;
    }

    .contact-link:last-child {
      border-bottom: 1px solid #333;
    }

    .contact-link span {
      color: #777;
      font-size: 13px;
    }

    .contact-link:hover {
      color: #999;
    }

    footer {
      padding: 25px 8%;
      border-top: 1px solid #292929;
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 22px;
      }

      nav {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">KLKSTUDIO.</a>

      <a href="productions.html">PRODUCTIONS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html" class="active">CONTACT</a>
    </nav>
  </header>

  <main>
    <p class="tag">GET IN TOUCH</p>

    <h1>CONTACT.</h1>

    <p class="intro">
      ¿Tenés un proyecto musical en mente?
      ¿Buscás un sonido propio para tu música?
      Hablemos y hagámoslo realidad.
    </p>

    <a class="contact-link"
       href="https://www.instagram.com/alejoklk.fv/"
       target="_blank">
      INSTAGRAM
      <span>@ALEJOKLK.FV ↗</span>
    </a>

       href="https://www.instagram.com/alejoklk.fv/"

      CONSULTAS
      <span>CONTACTAR ↗</span>
